<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B0C0F" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Arc" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-arc-192.png" />
<link rel="icon" type="image/png" href="./favicon-arc.png" />
<title>Arc</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --canvas:#0B0C0F;
    --surface:#15171C;
    --surface-2:#1C1F26;
    --ink:#ECEEF2;
    --ink-2:#C3C8D0;
    --muted:#A2A8B3;
    --line:#282C34;
    --line-2:#20242B;
    --brand:#7C8CFF;
    --good:#3FD08A; --bad:#F27272; --warn:#F5B14C;
    --pravin:#EC9A3B; --pravin-deep:#B36A14;
    --swetha:#EE6796; --swetha-deep:#B23F68;
    --accent:var(--pravin); --accent-deep:var(--pravin-deep);
    --r:20px; --r-sm:13px; --r-xs:9px;
    --sh-1:0 1px 2px rgba(0,0,0,.35);
    --sh-2:0 2px 10px rgba(0,0,0,.45), 0 16px 40px -22px rgba(0,0,0,.7);
    --sh-3:0 6px 18px rgba(0,0,0,.5), 0 28px 56px -24px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box}
  button,input,select,textarea{color:inherit}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    font-family:"Inter",system-ui,-apple-system,sans-serif;color:var(--ink);
    background:radial-gradient(130% 85% at 50% -12%, color-mix(in srgb, var(--accent) 12%, var(--canvas)) 0%, var(--canvas) 52%) fixed;
    -webkit-font-smoothing:antialiased;line-height:1.45;
    padding-bottom:calc(56px + env(safe-area-inset-bottom));transition:background .5s ease;
  }
  .wrap{max-width:1060px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 40px}
  .mono{font-family:"Space Grotesk",monospace;font-variant-numeric:tabular-nums}
  .display{font-family:"Space Grotesk",sans-serif}

  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
  .brand h1{font-family:"Space Grotesk";font-weight:800;letter-spacing:-.035em;font-size:clamp(27px,6.4vw,42px);line-height:.96;margin:0}
  .brand h1 .g{background:linear-gradient(105deg,var(--pravin),var(--swetha));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .brand p{margin:7px 0 0;color:var(--muted);font-size:13px;max-width:44ch}
  .rightcol{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
  .monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--sh-1)}
  .monthnav button{border:0;background:transparent;cursor:pointer;color:var(--ink);width:32px;height:32px;border-radius:999px;font-size:17px;display:grid;place-items:center;transition:.15s}
  .monthnav button:hover{background:var(--surface-2)}
  .monthnav .label{font-family:"Space Grotesk";font-weight:700;padding:0 8px;font-size:14px;min-width:104px;text-align:center;letter-spacing:.01em}
  .datepick{border:0;background:transparent;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:14px;color:var(--ink);padding:2px 6px;border-radius:8px;cursor:pointer;min-width:132px;text-align:center}
  .datepick:focus{outline:2px solid var(--accent);outline-offset:1px}
  .datepick::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.6}
  .status{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:5px 11px;border-radius:999px;box-shadow:var(--sh-1)}
  .status .led{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;transition:.3s}
  .status.ok .led{background:#2FA36B;box-shadow:0 0 0 3px rgba(47,163,107,.16)}
  .status.wait .led{background:#E0912A;box-shadow:0 0 0 3px rgba(224,145,42,.16)}
  .status.local .led{background:#8A909A}

  .tabs{display:flex;gap:5px;background:color-mix(in srgb,var(--surface) 82%, transparent);border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:22px;box-shadow:var(--sh-1);position:sticky;top:8px;z-index:40;backdrop-filter:blur(10px) saturate(1.3)}
  .tab{flex:1;border:0;background:transparent;cursor:pointer;padding:10px 8px;border-radius:999px;font-family:"Space Grotesk";font-weight:700;font-size:14.5px;color:var(--muted);letter-spacing:-.01em;transition:.18s;display:flex;align-items:center;justify-content:center;gap:8px}
  .tab .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .tab[data-who="pravin"] .dot{background:var(--pravin)}
  .tab[data-who="swetha"] .dot{background:var(--swetha)}
  .tab[data-who="both"] .dot{background:conic-gradient(from 210deg,var(--pravin),var(--swetha),var(--pravin))}
  .tab.active{color:#fff;box-shadow:0 6px 16px -7px rgba(16,20,28,.55)}
  .tab.active[data-who="pravin"]{background:linear-gradient(105deg,var(--pravin),var(--pravin-deep))}
  .tab.active[data-who="swetha"]{background:linear-gradient(105deg,var(--swetha),var(--swetha-deep))}
  .tab.active[data-who="both"]{background:linear-gradient(105deg,var(--pravin),var(--swetha))}
  .tab .dot{width:11px;height:11px}
  .tab.active .dot{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.28)}
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 13px}
  .sec-name{--c:#888;font-family:"Space Grotesk";font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
  .sec-name::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--c)}
  .mini-edit{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-family:"Inter";font-weight:600;font-size:13px;padding:7px 12px;border-radius:10px;cursor:pointer;transition:.15s;box-shadow:var(--sh-1);white-space:nowrap}
  .mini-edit:hover{background:var(--surface-2);border-color:var(--accent);color:var(--accent-deep)}
  .mini-edit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .eyebrow{font-family:"Space Grotesk";font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin:0 0 13px;display:flex;align-items:center;gap:11px}
  .eyebrow::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line-2),transparent)}
  section{margin-bottom:30px}

  .today-ring{display:flex;flex-direction:column;align-items:center;padding:8px 0 2px}
  .tr-wrap{position:relative;width:212px;height:212px}
  .tr-wrap svg{transform:rotate(-90deg)}
  .tr-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 22px;text-align:center}
  .tr-v{font-family:"Space Grotesk";font-weight:600;font-size:42px;letter-spacing:-.03em;line-height:.95;white-space:nowrap}
  .tr-v span{font-size:16px;color:var(--muted);font-weight:500}
  .tr-wt{display:flex;align-items:baseline;justify-content:center;gap:2px;max-width:100%}
  .tr-wt input{font-family:"Space Grotesk";font-weight:600;font-size:42px;letter-spacing:-.03em;line-height:.95;width:132px;max-width:100%;text-align:center;background:transparent;border:0;border-bottom:2px solid var(--line);color:var(--ink);padding:0 0 2px}
  .tr-wt input:focus{outline:none;border-bottom-color:var(--accent)}
  .tr-wt input::-webkit-outer-spin-button,.tr-wt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .tr-kg{font-family:"Space Grotesk";font-size:16px;color:var(--muted);font-weight:500}
  .tr-goal{background:transparent;border:0;cursor:pointer;font-family:"Space Grotesk";font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-top:12px;padding:3px 7px;border-radius:7px;transition:.15s}
  .tr-goal:hover{background:var(--surface-2)}
  .tr-l{font-family:"Space Grotesk";font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-top:12px}
  .tr-s{font-size:13px;color:var(--muted);margin-top:3px}
  .tr-chg{font-weight:600}
  .tr-chg.good{color:var(--good)} .tr-chg.up{color:var(--bad)}
  .goalgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:2px}
  .glab{display:flex;flex-direction:column;gap:5px;min-width:0}
  .glab>span:first-child{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  .gin{display:flex;align-items:baseline;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .gin:focus-within{border-color:var(--accent)}
  .gin input{font-family:"Space Grotesk";font-weight:600;font-size:17px;width:100%;min-width:0;background:transparent;border:0;color:var(--ink);padding:0}
  .gin input:focus{outline:none}
  .gin input::-webkit-outer-spin-button,.gin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .gin u{font-style:normal;font-size:12px;color:var(--muted);font-weight:500;flex:none}
  .today-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:18px 0 20px}
  .tchip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 13px 12px;box-shadow:var(--sh-1);min-width:0;overflow:hidden}
  .tchip .cl{font-family:"Space Grotesk";font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .tchip .cv{font-family:"Space Grotesk";font-weight:600;font-size:24px;margin-top:6px;line-height:1;letter-spacing:-.01em}
  .tchip .cv u{font-style:normal;font-size:12px;color:var(--muted)}
  .tchip .ct{height:4px;border-radius:2px;background:var(--surface-2);margin-top:9px;overflow:hidden}
  .tchip .ct i{display:block;height:100%;border-radius:2px}
  .tchip .cd{font-size:12px;font-weight:600;margin-top:8px}
  .habtile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:16px 14px;margin-bottom:16px}
  .habtile .tile-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
  .habtile .tl{font-family:"Space Grotesk";text-transform:uppercase;letter-spacing:.13em;font-size:10.5px;color:var(--muted);font-weight:600}
  .habtile .tc{font-family:"Space Grotesk";font-weight:600;font-size:13px;color:var(--muted)}
  .habtile .tc b{color:var(--ink)}
  .habrow{display:flex;flex-wrap:wrap;gap:14px 6px}
  .habicon{flex:1 0 18%;min-width:62px;max-width:94px;display:flex;flex-direction:column;align-items:center;gap:7px;background:transparent;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
  .hwrap{position:relative;width:56px;height:56px}
  .hprog{position:absolute;left:-4px;top:-4px;width:64px;height:64px}
  .hchip{position:absolute;inset:0;display:grid;place-items:center;border-radius:16px;border:1.5px solid var(--line);background:var(--surface-2);transition:transform .12s,background .12s}
  .habicon:active .hchip{transform:scale(.92)}
  .hbadge{position:absolute;right:-3px;top:-3px;width:19px;height:19px;border-radius:99px;background:var(--good);display:grid;place-items:center;border:2px solid var(--surface)}
  .hbadge svg{width:11px;height:11px}
  .hbadge.rest{background:var(--muted)}
  .hlabel{font-family:Inter;font-size:11px;font-weight:600;color:var(--muted);text-align:center;line-height:1.2;width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .habicon.done .hlabel{color:var(--ink)}
  .hsub{font-family:"Space Grotesk";font-size:10px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:2px;min-height:12px;line-height:1}
  .hsub svg{width:9px;height:9px}
  .habhint{font-size:11px;color:var(--muted);opacity:.8;text-align:center;margin-top:15px}
  .iconbtn{display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
  .iconpal{display:none;gap:6px;padding:11px 12px;flex-wrap:wrap;background:var(--surface-2);border-bottom:1px solid var(--line)}
  .iconpal.open{display:flex}
  .iconpal .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);transition:.12s}
  .iconpal .ic:hover{border-color:var(--muted)}
  .iconpal .ic.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 26%,transparent)}
  .today-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:13px;gap:10px}
  .remcard{display:flex;align-items:center;gap:12px;width:100%;padding:14px 15px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;margin:2px 0 12px;text-align:left;font:inherit;color:var(--ink)}
  .remcard .rc-ico{font-size:20px;line-height:1;flex:none}
  .remcard .rc-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
  .remcard .rc-tx b{font-size:14.5px;font-weight:600}
  .remcard .rc-tx i{font-style:normal;font-size:12px;color:var(--muted)}
  .remcard .rc-tag{margin-left:auto;font-family:"Space Grotesk";font-size:11px;font-weight:700;letter-spacing:.1em;padding:4px 9px;border-radius:99px;flex:none}
  .remcard.rc-off{border-style:dashed}
  .remcard.rc-off .rc-tag.off{background:var(--surface-2);color:var(--muted)}
  .remcard.rc-on{border-color:color-mix(in srgb,var(--good) 55%,transparent);background:color-mix(in srgb,var(--good) 9%,var(--surface))}
  .remcard.rc-on .rc-tx b{color:var(--good)}
  .remcard.rc-on .rc-tag{background:var(--good);color:#07120C}
  .remcard.rc-on .rc-dot{width:11px;height:11px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 22%,transparent);flex:none;margin:0 4px}
  .remcard.rc-blk{border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
  .remcard.rc-blk .rc-tx b{color:var(--bad)}
  .today-head .date{font-family:"Space Grotesk";font-weight:800;font-size:clamp(21px,4.6vw,27px);letter-spacing:-.025em}
  .today-head .date span{background:linear-gradient(100deg,var(--accent),var(--accent-deep));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .today-head .prog{font-size:13px;color:var(--muted);white-space:nowrap}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px}
  .card{--c:#888;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;display:flex;align-items:center;gap:13px;cursor:pointer;text-align:left;box-shadow:var(--sh-2);position:relative;overflow:hidden;transition:transform .13s cubic-bezier(.2,.7,.2,1), box-shadow .2s, background .2s, border-color .2s;-webkit-tap-highlight-color:transparent}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);opacity:.32;transition:opacity .2s}
  .card:hover{box-shadow:var(--sh-3);border-color:var(--line-2)}
  .card:active{transform:scale(.98)}
  .card:focus-visible{outline:2px solid var(--c);outline-offset:2px}
  .card.done{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-color:transparent}
  .card.done::before{opacity:1}
  .check{width:31px;height:31px;border-radius:10px;flex:none;display:grid;place-items:center;border:2px solid var(--line-2);color:#fff;background:var(--surface);transition:.2s}
  .card.done .check{background:var(--c);border-color:var(--c);box-shadow:0 4px 12px -3px color-mix(in srgb,var(--c) 60%,transparent)}
  .check svg{width:17px;height:17px;opacity:0;transform:scale(.4) rotate(-8deg);transition:.24s cubic-bezier(.2,.9,.2,1.3)}
  .card.done .check svg{opacity:1;transform:none}
  .card .body{min-width:0;flex:1}
  .card .name{font-weight:600;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .streak{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:5px}
  .card.done .streak{color:color-mix(in srgb,var(--c) 82%,#fff)}
  .flame{width:12px;height:13px;flex:none}
  .empty-note{grid-column:1/-1;color:var(--muted);font-size:14px;padding:20px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--surface-2)}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--sh-2);position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;left:17px;bottom:14px;width:26px;height:3px;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent-deep))}
  .stat .k{font-family:"Space Grotesk";font-weight:800;font-size:clamp(27px,6.6vw,36px);letter-spacing:-.035em;line-height:1}
  .stat .k small{font-size:15px;color:var(--muted);font-weight:600;margin-left:1px}
  .stat .l{font-size:12px;color:var(--muted);margin-top:16px;font-weight:500}

  .gridwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-2);overflow:hidden}
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.grid{border-collapse:separate;border-spacing:0;width:100%}
  table.grid th,table.grid td{padding:0;text-align:center}
  thead th{position:sticky;top:0;z-index:5;background:var(--surface);font-family:"Space Grotesk";font-size:11px;font-weight:500;color:var(--muted);height:36px;min-width:30px;border-bottom:1px solid var(--line-2)}
  thead th.today{color:var(--accent-deep);font-weight:600}
  thead th.today::after{content:"";display:block;height:2px;margin:3px 7px 0;border-radius:9px;background:var(--accent)}
  th.habitcol,td.habitcol{position:sticky;left:0;z-index:6;background:var(--surface);text-align:left;min-width:136px;max-width:136px;padding:0 12px;border-right:1px solid var(--line-2)}
  thead th.habitcol{z-index:7}
  td.habitcol{font-size:13px;font-weight:500;height:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
  td.habitcol .swatch{width:9px;height:9px;border-radius:50%;flex:none}
  th.countcol,td.countcol{position:sticky;right:0;z-index:6;background:var(--surface-2);min-width:46px;border-left:1px solid var(--line-2);font-family:"Space Grotesk";font-weight:600;font-size:13px}
  thead th.countcol{z-index:7;color:var(--muted)}
  tbody td{height:40px;border-bottom:1px solid var(--line)}
  td.day{min-width:30px}
  td.day.col-today{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
  .cell{--c:#888;position:relative;width:23px;height:23px;margin:auto;border-radius:8px;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;padding:0;display:block;transition:background .13s,border-color .13s,border-radius .13s,width .13s,margin .13s;-webkit-tap-highlight-color:transparent}
  .cell.sk{background:var(--surface-2);border-color:var(--line-2)}
  .cell.sk::after{content:"";position:absolute;left:5px;right:5px;top:50%;height:2px;border-radius:2px;background:var(--muted);transform:translateY(-50%)}
  .cell:hover{border-color:var(--c)}
  .cell.on{background:var(--c);border-color:var(--c)}
  .cell.on.lnkL{border-top-left-radius:2px;border-bottom-left-radius:2px;margin-left:-4px;width:27px}
  .cell.on.lnkR{border-top-right-radius:2px;border-bottom-right-radius:2px;margin-right:-4px;width:27px}
  .cell.on.lnkL.lnkR{width:31px}
  .cell:focus-visible{outline:2px solid var(--c);outline-offset:2px}
  tfoot td{height:36px;background:var(--surface-2);border-top:1px solid var(--line-2);font-family:"Space Grotesk";font-size:11px;font-weight:600;color:var(--muted)}
  tfoot td.total-on{color:var(--accent-deep)}
  tfoot td.habitcol{font-family:"Inter";font-size:11px;text-transform:uppercase;letter-spacing:.09em}
  .gridhint{padding:12px 15px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
  /* today card: rest-day (skip) state */
  .card.skip{background:var(--surface-2);border-color:var(--line);opacity:.9}
  .card.skip::before{opacity:.35;background:var(--muted)}

  /* today note */
  .noterow{margin-top:11px}

    padding:12px 14px;font-family:"Inter";font-size:14px;color:var(--ink);box-shadow:var(--sh-1)}

  .noterow .nlabel{font-family:"Space Grotesk";font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}

  /* cadence picker */

    padding:5px 9px;border-radius:8px;cursor:pointer;flex:none;white-space:nowrap}

  .freqpanel .fq{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-family:"Inter";font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:8px;cursor:pointer}

  .freqpanel .flbl{font-size:12px;color:var(--muted);width:100%;margin-bottom:2px}
  /* note modal */
  .modal-bg{position:fixed;inset:0;background:rgba(16,20,28,.42);backdrop-filter:blur(2px);display:none;place-items:center;z-index:100;padding:20px}

  .modal{background:var(--surface);border-radius:20px;box-shadow:0 24px 60px -18px rgba(0,0,0,.5);max-width:440px;width:100%;padding:20px;border:1px solid var(--line)}

  .modal .msub{font-size:12px;color:var(--muted);margin-bottom:13px}

  .noteslist{margin-top:15px;border-top:1px solid var(--line);padding-top:13px}

  .noteslist .nl{font-size:13px;line-height:1.5;margin-bottom:9px;display:flex;gap:9px}
  .noteslist .nl .dd{font-family:"Space Grotesk";font-size:11px;color:var(--muted);flex:none;padding-top:1px;min-width:34px}
  .noteslist .nl .bd{color:var(--ink);font-weight:600}
  .notecallout{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-left:5px solid var(--pc,var(--accent));border-radius:12px;padding:12px 14px}
  .notecallout .nc-h{font-family:"Space Grotesk";font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--warn);margin-bottom:6px;font-weight:600}
  .notecallout .nc-body{font-size:15px;font-weight:700;color:var(--ink);line-height:1.5;white-space:pre-wrap}
  .noteslist .nl-empty{font-size:12.5px;color:var(--muted)}
  .dchips{display:flex;flex-wrap:wrap;gap:6px}

  /* sub navigation (sections within a person) */

  .meals{display:flex;flex-direction:column;gap:2px}

  .meal .mcopy:hover,.meal .mcopy:active{background:var(--mc);color:#0B0C0F;transform:translateY(-1px)}
  .meal .mdel:hover{background:color-mix(in srgb,var(--swetha) 24%,transparent);color:var(--swetha)}
  .meal-empty{font-size:13px;color:var(--muted);padding:6px 2px}
  .mealday{margin-top:16px}
  .mealday .mday-h{font-family:"Space Grotesk";font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;padding-top:12px;border-top:1px solid var(--line-2)}

  .qspan{grid-column:1/-1}
  .water-total{font-size:22px;font-weight:750;color:var(--ink);margin:2px 0 8px}

  .goal-inline{font-family:"Space Grotesk";font-weight:600;font-size:15px;width:5.5em;max-width:130px;background:var(--surface-2);border:1px solid var(--accent);border-radius:8px;color:var(--ink);padding:3px 8px;text-align:center}

  .water-btns{display:flex;flex-wrap:wrap;gap:7px}
  .wbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer}
  .wbtn:hover{border-color:var(--accent);color:var(--accent)}

  function compressImage(file){ return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){ var max=1280,w=img.width,h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
      var c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); c.toBlob(function(b){ b?resolve(b):reject(new Error("could not process image")); },"image/jpeg",0.82);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error("that file isn't a readable image")); };
    img.src=url;
  });}
  function uploadPhoto(who,file,pose){
    if(!cloud||!supa){ toast("Connect to the shared database to add photos"); return; }
    if(!file || !/^image\//.test(file.type)){ toast("Please choose an image"); return; }
    pose=pose||"front"; toast("Processing "+poseLabel(pose)+" photo…");
    compressImage(file).then(function(blob){
      var id=uid(), ym=ymKey(), day=selDay, path=who+"/"+ym+"/"+day+"_"+pose+"_"+id+".jpg";
      return supa.storage.from(PHOTO_BUCKET).upload(path, blob, {contentType:"image/jpeg",upsert:true}).then(function(res){
        if(res.error) throw res.error;
        var existing=photoAt(who,ym,day,pose);
        state.photos[id]={person:who,ym:ym,day:day,pose:pose,path:path};
        enqueue({k:"photoAdd",id:id,person:who,ym:ym,day:day,pose:pose,path:path});
        if(existing){ delete state.photos[existing.id]; enqueue({k:"photoDel",id:existing.id}); if(supa&&cloud){try{supa.storage.from(PHOTO_BUCKET).remove([existing.path]);}catch(e){}} }
        saveCache(); toast(poseLabel(pose)+" photo added"); render();
      });
    }).catch(function(e){ toast("Upload failed: "+((e&&e.message)||e)); });
  }

  // weight ring: arc = progress from starting weight toward goal; centre = latest weight (editable on Today)
  function weightRing(who, editable){
    var accent=who==="swetha"?"var(--swetha)":"var(--pravin)", circ=565.48;
    var raw=[]; for(var wk in state.weights){ var pk=wk.split("|"); if(pk[0]===who) raw.push({ym:pk[1],day:+pk[2],y:+state.weights[wk]}); }
    raw.sort(function(a,b){ return ymRank(a.ym)-ymRank(b.ym) || a.day-b.day; });
    var latestAll=raw.length?raw[raw.length-1].y:null, start=raw.length?raw[0].y:null, goal=getGoal(who);
    var sel=getWeight(who,selDay), latest=(sel!=null?sel:latestAll);
    var pct;
    if(latest==null||start==null) pct=0;
    else if(start<=goal) pct=(latest<=goal?100:0);
    else pct=Math.max(0,Math.min(100, Math.round((start-latest)/(start-goal)*100)));
    var off=(circ*(1-pct/100)).toFixed(1);
    var remain = latest!=null ? (latest-goal) : null;
    // "since last" delta: compare the viewed day's entry to the entry just before it
    var refIdx=-1;
    if(sel!=null){ var ymk=ymKey(); for(var ri=0;ri<raw.length;ri++){ if(raw[ri].ym===ymk && raw[ri].day===selDay){ refIdx=ri; break; } } }
    else { refIdx=raw.length-1; }
    var chg = (refIdx>0) ? (raw[refIdx].y - raw[refIdx-1].y) : null;
    var chgTxt = (chg!=null && Math.abs(chg)>0.0001) ? ' <span class="tr-chg '+(chg<0?'good':'up')+'">'+(chg<0?'\u2193':'\u2191')+bfmt(Math.abs(chg))+'</span>' : '';
    var subTxt = latest==null ? (editable?'Tap the number to log today':'No weight logged')
               : ((remain>0.0001 ? bfmt(Math.abs(remain))+' kg to goal' : (remain<-0.0001 ? bfmt(Math.abs(remain))+' kg under goal' : 'Goal reached \u2713'))+chgTxt);
    var center = editable
      ? '<div class="tr-wt"><input id="ringWt" type="number" step="0.01" min="0" inputmode="decimal" value="'+(latest!=null?wfmt(latest):'')+'" placeholder="—" aria-label="Weight in kg"/><span class="tr-kg">kg</span></div>'
      : '<div class="tr-v">'+(latest!=null?wfmt(latest):'\u2014')+'<span> kg</span></div>';
    var goalLabel = editable
      ? '<button class="tr-goal" id="ringGoal" type="button">toward '+bfmt(goal)+' kg goal</button>'
      : '<div class="tr-l">toward '+bfmt(goal)+' kg</div>';
    return '<div class="today-ring"><div class="tr-wrap"><svg width="212" height="212" viewBox="0 0 212 212"><circle cx="106" cy="106" r="90" fill="none" stroke="var(--surface-2)" stroke-width="14"/><circle cx="106" cy="106" r="90" fill="none" stroke="'+accent+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'"/></svg><div class="tr-mid">'+center+goalLabel+'<div class="tr-s">'+subTxt+'</div></div></div></div>';
  }

  function habitCount(hid){var pre=hid+"|"+ymKey()+"|",n=0;for(var k in state.logs){if(k.indexOf(pre)===0&&state.logs[k]==="done")n++;}return n;}
  function skipCount(hid){var pre=hid+"|"+ymKey()+"|",n=0;for(var k in state.logs){if(k.indexOf(pre)===0&&state.logs[k]==="skip")n++;}return n;}
  function dayTotal(who,day){var n=0;state.habits[who].forEach(function(h){if(isDone(h.id,day))n++;});return n;}
  function activeDays(who){var dim=daysIn(view.y,view.m),n=0;for(var d=1;d<=dim;d++){if(dayTotal(who,d)>0)n++;}return n;}
  // streak: skips are neutral (don't break, don't add); misses break it
  function currentStreak(who,hid){
    var end=selDay,s=0;
    for(var d=end;d>=1;d--){ if(isDone(hid,d)) s++; else if(isSkip(hid,d)) continue; else break; }
    return s;
  }
  function bestStreak(who){
    var dim=daysIn(view.y,view.m),best=0;
    state.habits[who].forEach(function(h){var r=0;for(var d=1;d<=dim;d++){ if(isDone(h.id,d)){r++;if(r>best)best=r;} else if(isSkip(h.id,d)){} else r=0; }});
    return best;
  }
  // weekly helpers (Mon–Sun window containing "day", clipped to month)
  function weekWindow(day){
    var dim=daysIn(view.y,view.m), dow=(new Date(view.y,view.m,day).getDay()+6)%7; // 0=Mon
    var start=Math.max(1,day-dow), end=Math.min(dim,start+6);
    return [start,end];
  }
  function doneInRange(hid,a,b){var n=0;for(var d=a;d<=b;d++)if(isDone(hid,d))n++;return n;}
  function thisWeekDone(hid){ var w=weekWindow(selDay); return doneInRange(hid,w[0],w[1]); }
  // per-habit consistency (0..1), target-aware, excluding skipped days
  function habitConsistency(who,hb,elapsed){
    if(hb.week>0){ // weekly target
      var dim=daysIn(view.y,view.m), refEnd=isThisMonth()?todayDate():dim;
      var weeksElapsed=Math.max(1,Math.ceil(refEnd/7)); var expected=hb.week*weeksElapsed;
      return expected? Math.min(1, habitCount(hb.id)/expected) : 0;
    }
    var denom=Math.max(1, elapsed - skipCount(hb.id)); // daily: exclude rest days
    return Math.min(1, habitCount(hb.id)/denom);
  }

  function enqueue(op){ if(!wantCloud) return; outbox.push(op); saveOutbox(); updateSyncBar(); if(cloud) flush(); }
  var flushing=false;
  function isTransient(err){
    // Decide whether a failed write should keep retrying (connection-ish)
    // or is rejected by the server for this specific op (schema/constraint).
    if(!err) return true;
    if(err.name==="TypeError") return true;                         // fetch/network failure
    var m=((err.message||"")+"");
    if(/fetch|network|timeout|Failed to fetch|load failed/i.test(m)) return true;
    var c=((err.code||"")+"");                                      // Postgres SQLSTATE / PostgREST code
    if(/^(42|23|22|PGRST)/.test(c)) return false;                   // undefined column/table, constraint, etc = permanent
    return true;                                                    // unknown server error → retry (don't drop recoverable writes)
  }
  function flush(){
    if(!cloud||flushing) return;
    if(!navigator.onLine){ setStatus("wait","Offline — will sync"); return; }
    flushing=true; setStatus("wait","Syncing…");
    var passCount=outbox.length;   // only touch items present at the start of this pass (prevents re-hitting rotated ops)
    (function step(){
      if(passCount<=0 || !outbox.length){
        flushing=false;
        if(outbox.length){ setStatus("wait","Retrying soon"); } else { lastPermErr=""; setStatus("ok","Synced"); }
        updateSyncBar();
        return;
      }
      var op=outbox[0];
      applyOp(op).then(function(){ outbox.shift(); saveOutbox(); passCount--; updateSyncBar(); step(); })
        .catch(function(err){
          if(isTransient(err)){
            // connection problem — keep everything queued in order and retry later
            flushing=false; setStatus("wait","Retrying soon"); updateSyncBar();
            return;
          }
          // server rejected THIS op (e.g. schema mismatch) — record why, move it to the back so it
          // can't jam the rest; it will retry on later flushes and succeed once the cause is fixed.
          lastPermErr=(err&&(err.message||err.code))?((err.code?err.code+": ":"")+(err.message||"")):"rejected by database";
          outbox.push(outbox.shift()); saveOutbox(); passCount--; updateSyncBar(); step();
        });
    })();
  }
  function rawOp(op){
    if(op.k==="log"){
      if(op.state) return supa.from("logs").upsert({habit_id:op.hid,ym:op.ym,day:op.day,state:op.state},{onConflict:"habit_id,ym,day"});
      return supa.from("logs").delete().match({habit_id:op.hid,ym:op.ym,day:op.day});
    }
    if(op.k==="note"){
      if(op.body) return supa.from("notes").upsert({person:op.person,ym:op.ym,day:op.day,body:op.body},{onConflict:"person,ym,day"});
      return supa.from("notes").delete().match({person:op.person,ym:op.ym,day:op.day});
    }
    if(op.k==="weight"){
      if(op.kg!=null) return supa.from("weights").upsert({person:op.person,ym:op.ym,day:op.day,kg:op.kg},{onConflict:"person,ym,day"});
      return supa.from("weights").delete().match({person:op.person,ym:op.ym,day:op.day});
    }
    if(op.k==="water"){
      if(op.ml!=null && op.ml>0) return supa.from("water").upsert({person:op.person,ym:op.ym,day:op.day,ml:op.ml},{onConflict:"person,ym,day"});
      return supa.from("water").delete().match({person:op.person,ym:op.ym,day:op.day});
    }
    if(op.k==="steps"){
      if(op.count!=null && op.count>0) return supa.from("steps").upsert({person:op.person,ym:op.ym,day:op.day,count:op.count},{onConflict:"person,ym,day"});
      return supa.from("steps").delete().match({person:op.person,ym:op.ym,day:op.day});
    }
    if(op.k==="body"){
      var bodyAny = op.site1!=null||op.site2!=null||op.site3!=null||op.bodyfat!=null;
      if(bodyAny) return supa.from("body").upsert({person:op.person,ym:op.ym,day:op.day,site1:op.site1,site2:op.site2,site3:op.site3,bodyfat:op.bodyfat},{onConflict:"person,ym,day"});
      return supa.from("body").delete().match({person:op.person,ym:op.ym,day:op.day});
    }
    if(op.k==="tape"){
      var tapeAny = op.thigh!=null||op.triceps!=null||op.hip!=null||op.waist!=null||op.abdomen!=null;
      if(tapeAny) return supa.from("tape").upsert({person:op.person,ym:op.ym,day:op.day,thigh:op.thigh,triceps:op.triceps,hip:op.hip,waist:op.waist,abdomen:op.abdomen},{onConflict:"person,ym,day"});
      return supa.from("tape").delete().match({person:op.person,ym:op.ym,day:op.day});
    }
    if(op.k==="goals"){
      return supa.from("goals").upsert({person:op.person,target:op.weight,water:op.water,steps:op.steps},{onConflict:"person"});
    }
    if(op.k==="inbody"){
      var inbAny = op.smm!=null||op.bfm!=null||op.bmi!=null||op.bfp!=null||op.vfa!=null||op.whr!=null;
      if(inbAny) return supa.from("inbody").upsert({person:op.person,ym:op.ym,day:op.day,smm:op.smm,bfm:op.bfm,bmi:op.bmi,bfp:op.bfp,vfa:op.vfa,whr:op.whr},{onConflict:"person,ym,day"});
      return supa.from("inbody").delete().match({person:op.person,ym:op.ym,day:op.day});
    }
    if(op.k==="photoAdd") return supa.from("photos").upsert({id:op.id,person:op.person,ym:op.ym,day:op.day,pose:op.pose||"front",path:op.path},{onConflict:"id"});
    if(op.k==="photoDel") return supa.from("photos").delete().eq("id",op.id);
    if(op.k==="mealAdd") return supa.from("meals").upsert({id:op.id,person:op.person,ym:op.ym,day:op.day,at:op.at,item:op.item,sort:op.sort||0},{onConflict:"id"});
    if(op.k==="mealDel") return supa.from("meals").delete().eq("id",op.id);
    if(op.k==="mealSort") return supa.from("meals").update({sort:op.sort}).eq("id",op.id);
    if(op.k==="habitAdd") return supa.from("habits").insert({id:op.id,person:op.person,label:op.label,color:op.color,sort:op.sort,week:op.week||0,icon:op.icon||null});
    if(op.k==="habitIcon") return supa.from("habits").update({icon:op.icon}).eq("id",op.id);
    if(op.k==="habitRename") return supa.from("habits").update({label:op.label}).eq("id",op.id);
    if(op.k==="habitColor") return supa.from("habits").update({color:op.color}).eq("id",op.id);
    if(op.k==="habitFreq") return supa.from("habits").update({week:op.week}).eq("id",op.id);
    if(op.k==="habitSort") return supa.from("habits").update({sort:op.sort}).eq("id",op.id);
    if(op.k==="habitDel") return supa.from("habits").delete().eq("id",op.id);
    if(op.k==="person") return supa.from("people").upsert({person:op.person,display_name:op.name},{onConflict:"person"});

  // Dependency-free SVG line chart. series=[{name,color,points:[{x,y}]}], dim=days in month.
  function weightChart(series,dim){
    var all=[], xs=[]; series.forEach(function(s){s.points.forEach(function(p){all.push(p.y);xs.push(p.x);});});
    if(!all.length) return "";
    var yMin=Math.min.apply(null,all), yMax=Math.max.apply(null,all);
    if(yMin===yMax){ yMin-=1; yMax+=1; } else { var pad=(yMax-yMin)*0.15; yMin-=pad; yMax+=pad; }
    yMin=Math.floor(yMin*2)/2; yMax=Math.ceil(yMax*2)/2;   // snap to 0.5 kg for readable labels
    var xMin=Math.min.apply(null,xs), xMax=Math.max.apply(null,xs);
    if(xMin===xMax){ xMin-=1; xMax+=1; }   // single day → give the point room instead of stranding it
    var W=340,H=190,ml=34,mr=12,mt=14,mb=22, pw=W-ml-mr, ph=H-mt-mb;
    function X(d){return ml+(d-xMin)/(xMax-xMin)*pw;}
    function Y(v){return mt+(yMax-v)/(yMax-yMin)*ph;}
    var mon=MONTHS[view.m].slice(0,3);
    var labelByX={}; series.forEach(function(s){s.points.forEach(function(p){ if(p.label!=null) labelByX[p.x]=p.label; });});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" class="wchart" preserveAspectRatio="none" role="img">';
    for(var g=0;g<=2;g++){
      var v=yMin+(yMax-yMin)*g/2, y=Y(v);
      svg+='<line x1="'+ml+'" y1="'+y.toFixed(1)+'" x2="'+(W-mr)+'" y2="'+y.toFixed(1)+'" class="wgrid"/>';
      svg+='<text x="'+(ml-5)+'" y="'+(y+3).toFixed(1)+'" class="wylab">'+v.toFixed(1)+'</text>';
    }
    var mid=Math.round((xMin+xMax)/2);
    [xMin,mid,xMax].filter(function(d,i,a){return a.indexOf(d)===i;}).forEach(function(d){
      var lab=(labelByX[d]!=null)?labelByX[d]:'';
      if(!lab) return;
      var anc = d===xMin?'start':(d===xMax?'end':'middle');
      svg+='<text x="'+X(d).toFixed(1)+'" y="'+(H-6)+'" class="wxlab" text-anchor="'+anc+'">'+lab+'</text>';
    });
    series.forEach(function(s){
      if(!s.points.length) return;
      var dstr=s.points.map(function(p,i){return (i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');
      svg+='<path d="'+dstr+'" fill="none" stroke="'+s.color+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" class="wline"/>';
      s.points.forEach(function(p){ svg+='<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.2" fill="#fff" stroke="'+s.color+'" stroke-width="2"/>'; });
    });
    svg+='</svg>';
    return svg;
  }

  function refreshPushState(){
    if(!pushSupported()){ setPushState("unsupported"); return; }
    if(typeof Notification!=="undefined" && Notification.permission==="denied"){ setPushState("blocked"); return; }
    navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription(); })
      .then(function(sub){ setPushState(sub?"on":"off"); })
      .catch(function(){ setPushState("off"); });
  }
  function enablePush(person){
    if(!pushSupported()){ toast("This browser can't do reminders"); return; }
    if(Notification.permission==="denied"){ setPushState("blocked"); toast("Notifications are blocked. Turn them on for Arc in your phone's browser/site settings, then tap again."); return; }
    if(!supa){ toast("Open Arc while online first, then try (needs sync)"); return; }
    Notification.requestPermission().then(function(perm){
      if(perm==="denied"){ setPushState("blocked"); toast("Blocked — enable notifications for Arc in settings, then tap again"); return; }
      if(perm!=="granted"){ toast("Tap Allow to turn on reminders"); return; }
      navigator.serviceWorker.ready.then(function(reg){
        return reg.pushManager.getSubscription().then(function(sub){ return sub || reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToUint8Array(CONFIG.VAPID_PUBLIC)}); });
      }).then(function(sub){
        var j=sub.toJSON()||{}, keys=j.keys||{};
        localStorage.setItem("arc.push.person", person);
        return supa.from("push_subscriptions").upsert({person:person, endpoint:sub.endpoint, p256dh:keys.p256dh, auth:keys.auth, ua:navigator.userAgent, updated_at:new Date().toISOString()},{onConflict:"endpoint"});
      }).then(function(res){ if(res&&res.error){ toast("Save failed: "+res.error.message); } else { pushState="on"; toast("Reminders ON for "+(state.names[person]||person)+" on this phone"); render(); } })
        .catch(function(e){ toast("Couldn't enable: "+(e.message||e)); });
    });
  }
  function disablePush(){
    if(!pushSupported())return;
    navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription(); }).then(function(sub){
      if(!sub){ localStorage.removeItem("arc.push.person"); pushState="off"; render(); return; }
      var ep=sub.endpoint;
      return sub.unsubscribe().then(function(){ if(supa) return supa.from("push_subscriptions").delete().eq("endpoint",ep); }).then(function(){ localStorage.removeItem("arc.push.person"); pushState="off"; toast("Reminders turned off on this phone"); render(); });
    }).catch(function(e){ toast("Couldn't turn off: "+(e.message||e)); });
  }
  function reminderCard(person){
    var name=esc(state.names[person]||person);
    if(pushState==="unsupported") return '<div class="remcard rc-off"><span class="rc-ico">\uD83D\uDD14</span><span class="rc-tx"><b>Reminders unavailable</b><i>This browser doesn\u2019t support push notifications</i></span></div>';
    if(pushState==="blocked") return '<button class="remcard rc-blk" id="remBtn" type="button"><span class="rc-ico">\uD83D\uDD15</span><span class="rc-tx"><b>Reminders blocked</b><i>Allow notifications for Arc in settings, then tap</i></span></button>';
    if(pushState==="on"){ var pp=pushPerson()||person; return '<button class="remcard rc-on" id="remBtn" type="button"><span class="rc-dot"></span><span class="rc-tx"><b>Reminders are ON</b><i>'+esc(state.names[pp]||pp)+' \u00b7 this phone \u00b7 tap to turn off</i></span><span class="rc-tag">ON</span></button>'; }
    return '<button class="remcard rc-off" id="remBtn" type="button"><span class="rc-ico">\uD83D\uDD14</span><span class="rc-tx"><b>Turn on reminders</b><i>For '+name+' on this phone</i></span><span class="rc-tag off">OFF</span></button>';
  }
  function wireReminderBtn(person){ var rb=document.getElementById("remBtn"); if(rb) rb.onclick=function(){ if(pushState==="on") disablePush(); else if(pushState==="blocked") toast("Notifications are blocked for Arc. Enable them in your phone's site settings, then tap again."); else enablePush(person); }; }


  function renderProfile(who){

    else if(section==="habits") h+=secHabits(who);

    else if(section==="food") h+=secFood(who);

  // ───────── all-time helpers (report + compare) ─────────
  function ymParse(ym){var p=(ym||"").split("-");return {y:+p[0],m:+p[1]};}
  function ymDays(ym){var o=ymParse(ym);return new Date(o.y,o.m,0).getDate();}
  function ymDow(ym,day){var o=ymParse(ym);return new Date(o.y,o.m-1,day).getDay();}
  function ymLabel(ym){var o=ymParse(ym);return MONTHS[o.m-1]+" "+o.y;}
  function ymShort(ym){var o=ymParse(ym);return MONTHS[o.m-1].slice(0,3);}
  function ymRank(ym){var o=ymParse(ym);return o.y*12+o.m;}
  function allMonths(){
    var set={};
    function add(ym){ if(ym) set[ym]=1; }
    for(var k in state.weights) add(k.split("|")[1]);
    for(var k in state.water) add(k.split("|")[1]);
    for(var k in state.steps) add(k.split("|")[1]);
    for(var k in state.body) add(k.split("|")[1]);
    for(var k in state.tape) add(k.split("|")[1]);
    for(var k in state.inbody) add(k.split("|")[1]);
    for(var k in state.notes) add(k.split("|")[1]);
    for(var k in state.logs) add(k.split("|")[1]);
    for(var id in state.meals) add(state.meals[id].ym);
    for(var id in state.photos) add(state.photos[id].ym);
    return Object.keys(set).sort(function(a,b){return ymRank(a)-ymRank(b);});
  }

    var a=[]; for(var id in state.photos){var p=state.photos[id]; if(p.person===who) a.push({id:id,ym:p.ym,day:p.day,path:p.path});}

  function ptsFor(store,who,ym){ var a=[],days=ymDays(ym); for(var d=1;d<=days;d++){var v=store[who+"|"+ym+"|"+d]; if(v!=null&&v!=="") a.push({x:d,y:+v});} return a; }

  // ───────── HTML progress report ─────────
  var REP_PLACEHOLDER="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="160"><rect width="120" height="160" fill="#efeae2"/><text x="60" y="82" font-size="9" fill="#9a948a" text-anchor="middle">image unavailable</text></svg>');
  function repLine(pts,color){
    if(!pts.length) return '<div style="color:#9a948a;font-size:12px;padding:6px 0">No data</div>';
    var W=300,H=92,pad=11, xs=pts.map(function(p){return p.x;}), ys=pts.map(function(p){return p.y;});
    var xmin=Math.min.apply(null,xs),xmax=Math.max.apply(null,xs); if(xmin===xmax)xmax=xmin+1;
    var ymin=Math.min.apply(null,ys),ymax=Math.max.apply(null,ys); if(ymin===ymax){ymin-=1;ymax+=1;} var p2=(ymax-ymin)*0.15; ymin-=p2; ymax+=p2;
    function X(x){return (pad+(x-xmin)/(xmax-xmin)*(W-2*pad)).toFixed(1);}
    function Y(y){return (H-pad-(y-ymin)/(ymax-ymin)*(H-2*pad)).toFixed(1);}
    var d=pts.map(function(p,i){return (i?'L':'M')+X(p.x)+' '+Y(p.y);}).join(' ');
    var dots=pts.map(function(p){return '<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="2.4" fill="#fff" stroke="'+color+'" stroke-width="1.6"/>';}).join('');
    return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:340px;height:auto;margin-top:4px"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round"/>'+dots+'</svg>';
  }
  function repHabitConsistency(who,ym){
    var hs=state.habits[who]||[], days=ymDays(ym);
    if(!hs.length) return '<div class="rp-sub">No habits</div>';
    var h='<div class="rp-hcon">';
    hs.forEach(function(hb){
      var done=0; for(var d=1;d<=days;d++){ if(state.logs[hb.id+"|"+ym+"|"+d]==="done") done++; }
      var target = hb.week>0 ? Math.max(1,Math.round(hb.week*days/7)) : days;
      var pct=Math.min(100,Math.round(done/target*100));
      var freq = hb.week>0 ? ' <span class="rp-hfreq">'+hb.week+'\u00d7/wk</span>' : '';
      h+='<div class="rp-hrow"><span class="rp-hdot" style="background:'+hb.color+'"></span><span class="rp-hname">'+esc(hb.label)+freq+'</span><span class="rp-hbar"><span style="width:'+pct+'%;background:'+hb.color+'"></span></span><span class="rp-hval">'+done+'/'+target+' · '+pct+'%</span></div>';
    });
    return h+'</div>';
  }

  function fetchAsDataURL(url){
    return fetch(url).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.blob(); })
      .then(function(b){ return new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){res(fr.result);}; fr.onerror=function(){rej(new Error("read failed"));}; fr.readAsDataURL(b); }); });
  }
  function downloadReport(scope){
    if(!cloud||!supa){ toast("Connect to the shared database to download the report"); return; }
    var paths=collectPhotoPaths(scope), pmap={}, done=0;
    toast(paths.length?("Building report… embedding "+paths.length+" photo(s)"):"Building report…");
    var chain=Promise.resolve();
    paths.forEach(function(p){
      chain=chain.then(function(){ return fetchAsDataURL(photoUrl(p)).then(function(d){pmap[p]=d;}).catch(function(){pmap[p]=REP_PLACEHOLDER;}).then(function(){ done++; if(done%3===0||done===paths.length) toast("Embedding photos… "+done+"/"+paths.length); }); });
    });
    chain.then(function(){
      var html=buildReportHTML(scope,pmap), blob=new Blob([html],{type:"text/html"}), url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download="habits-report-"+scope+"-"+selISO()+".html"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},5000); toast("Report downloaded");
    }).catch(function(e){ toast("Report failed: "+((e&&e.message)||e)); });
  }

  function wireTimelapse(root){
    var key=root.getAttribute("data-tl");
    var stage=root.querySelector(".tl-stage");
    var dateLabels=(root.getAttribute("data-dates")||"").split("||"), n=dateLabels.length;
    if(!n || !stage) return;
    var frames=stage.querySelectorAll(".tl-frame");
    var dateEl=root.querySelector(".tl-date"), scrub=root.querySelector(".tl-scrub"), playBtn=root.querySelector(".tl-play");
    var idx=0, playing=false, speed=800, pose=root.getAttribute("data-pose")||(POSES[0]&&POSES[0].k);
    function show(i){ idx=((i%n)+n)%n; for(var f=0;f<frames.length;f++){ var fr=frames[f]; fr.style.opacity=(fr.getAttribute("data-pose")===pose && +fr.getAttribute("data-idx")===idx)?1:0; } if(dateEl) dateEl.textContent=dateLabels[idx]||""; if(scrub) scrub.value=idx; }
    function stop(){ playing=false; if(tlTimers[key]){clearInterval(tlTimers[key]); tlTimers[key]=null;} if(playBtn) playBtn.innerHTML="\u25B6 Play"; }
    function play(){ playing=true; if(playBtn) playBtn.innerHTML="\u23F8 Pause"; if(tlTimers[key]) clearInterval(tlTimers[key]); tlTimers[key]=setInterval(function(){ show(idx+1); }, speed); }
    if(playBtn) playBtn.onclick=function(){ playing?stop():play(); };
    if(scrub) scrub.oninput=function(){ stop(); show(+scrub.value); };
    root.querySelectorAll(".tl-sp").forEach(function(b){ b.onclick=function(){ speed=+b.getAttribute("data-sp"); root.querySelectorAll(".tl-sp").forEach(function(x){x.classList.remove("active");}); b.classList.add("active"); if(playing) play(); }; });
    root.querySelectorAll(".tl-pose").forEach(function(b){ if(b.disabled) return; b.onclick=function(){ pose=b.getAttribute("data-tlpose"); root.querySelectorAll(".tl-pose").forEach(function(x){x.classList.remove("active");}); b.classList.add("active"); stop(); show(idx); }; });
    show(0);
  }

    el.addEventListener("click",function(){ if(longed){longed=false;return;} onTap(); });
    el.addEventListener("contextmenu",function(e){ e.preventDefault(); fireLong(); });
    el.addEventListener("touchstart",function(){ if(timer)clearTimeout(timer); timer=setTimeout(function(){ if(navigator.vibrate)navigator.vibrate(15); fireLong(); },500); },{passive:true});
    ["touchend","touchmove","touchcancel"].forEach(function(ev){ el.addEventListener(ev,function(){ if(timer){clearTimeout(timer);timer=null;} }); });
  }

    if(stI) stI.onkeydown=function(e){ if(e.key==="Enter") saveSt(); };
    var bSave=document.getElementById("bodySave");
    if(bSave) bSave.onclick=function(){ var o={}; app.querySelectorAll("[data-body]").forEach(function(el){ var v=el.value.trim(); o[el.dataset.body]= v===""?null:parseFloat(v); }); setBody(who,selDay,o); render(); toast("Reading saved"); };
    var bDel=document.getElementById("bodyDel");
    if(bDel) bDel.onclick=function(){ if(confirm("Delete this day’s reading?")){ setBody(who,selDay,{site1:null,site2:null,site3:null,bodyfat:null}); render(); toast("Deleted"); } };
    var tSave=document.getElementById("tapeSave");
    if(tSave) tSave.onclick=function(){ var o={}; app.querySelectorAll("[data-tape]").forEach(function(el){ var v=el.value.trim(); o[el.dataset.tape]= v===""?null:parseFloat(v); }); setTape(who,selDay,o); render(); toast("Measurement saved"); };
    var tDel=document.getElementById("tapeDel");
    if(tDel) tDel.onclick=function(){ if(confirm("Delete this day’s measurement?")){ setTape(who,selDay,{thigh:null,triceps:null,hip:null,waist:null,abdomen:null}); render(); toast("Deleted"); } };
    var iSave=document.getElementById("inbodySave");
    if(iSave) iSave.onclick=function(){ var o={}; app.querySelectorAll("[data-inbody]").forEach(function(el){ var v=el.value.trim(); o[el.dataset.inbody]= v===""?null:parseFloat(v); }); setInbody(who,selDay,o); render(); toast("InBody scan saved"); };
    var iDel=document.getElementById("inbodyDel");
    if(iDel) iDel.onclick=function(){ if(confirm("Delete this day’s InBody scan?")){ setInbody(who,selDay,{smm:null,bfm:null,bmi:null,bfp:null,vfa:null,whr:null}); render(); toast("Deleted"); } };
    app.querySelectorAll("[data-bodyview]").forEach(function(el){ el.onclick=function(){ bodyView=el.getAttribute("data-bodyview"); render(); }; });
    app.querySelectorAll("[data-rename]").forEach(function(el){el.onchange=function(){var hb=find(who,el.dataset.rename);if(hb){hb.label=el.value.trim()||hb.label;enqueue({k:"habitRename",id:hb.id,label:hb.label});saveCache();render();}};});
    app.querySelectorAll("[data-color]").forEach(function(el){el.onclick=function(){var pal=app.querySelector('[data-pal="'+el.dataset.color+'"]');if(pal)pal.classList.toggle("open");};});
    app.querySelectorAll("[data-iconbtn]").forEach(function(el){el.onclick=function(){var ip=app.querySelector('[data-iconpal="'+el.dataset.iconbtn+'"]');if(ip)ip.classList.toggle("open");};});
    app.querySelectorAll("[data-pickicon]").forEach(function(el){el.onclick=function(){var p=el.dataset.pickicon.split("|"),hb=find(who,p[0]);if(hb){hb.icon=p[1];enqueue({k:"habitIcon",id:hb.id,icon:p[1]});saveCache();render();}};});
    app.querySelectorAll("[data-pick]").forEach(function(el){el.onclick=function(){var p=el.dataset.pick.split("|"),hb=find(who,p[0]);if(hb){hb.color=p[1];enqueue({k:"habitColor",id:hb.id,color:p[1]});saveCache();render();}};});
    app.querySelectorAll("[data-freq]").forEach(function(el){el.onclick=function(){var fp=app.querySelector('[data-fqp="'+el.dataset.freq+'"]');if(fp)fp.classList.toggle("open");};});
    app.querySelectorAll("[data-mmv]").forEach(function(el){el.onclick=function(){var p=el.dataset.mmv.split("|");moveMeal(who,+p[1],p[2],p[0]);};});
    app.querySelectorAll("[data-fq]").forEach(function(el){el.onclick=function(){var p=el.dataset.fq.split("|"),hb=find(who,p[0]);if(hb){hb.week=+p[1];enqueue({k:"habitFreq",id:hb.id,week:hb.week});saveCache();render();}};});
    app.querySelectorAll("[data-del]").forEach(function(el){el.onclick=function(){var hb=find(who,el.dataset.del);if(hb&&confirm('Remove "'+hb.label+'"? Its logged days will be cleared.')){state.habits[who]=state.habits[who].filter(function(x){return x.id!==hb.id;});var pre=hb.id+"|";Object.keys(state.logs).forEach(function(k){if(k.indexOf(pre)===0)delete state.logs[k];});enqueue({k:"habitDel",id:hb.id});saveCache();render();}};});
    var add=document.getElementById("addHabit"),inp=document.getElementById("newHabit");
    function addH(){var v=(inp.value||"").trim();if(!v)return;var color=PALETTE[state.habits[who].length%PALETTE.length],id=uid(),sort=state.habits[who].length,ic=habitIconKey({label:v});state.habits[who].push({id:id,label:v,color:color,sort:sort,week:0,icon:ic});enqueue({k:"habitAdd",person:who,id:id,label:v,color:color,sort:sort,week:0,icon:ic});inp.value="";saveCache();render();var n=document.getElementById("newHabit");if(n)n.focus();}
    if(add)add.onclick=addH; if(inp)inp.onkeydown=function(e){if(e.key==="Enter")addH();};
    var rp=document.getElementById("renameProfile");
    if(rp)rp.onclick=function(){var v=prompt("Name for this person:",state.names[who]);if(v&&v.trim()){state.names[who]=v.trim();enqueue({k:"person",person:who,name:v.trim()});saveCache();render();}};
    var rf=document.getElementById("refresh"); if(rf)rf.onclick=pull;
    var b=document.getElementById("backup"),r=document.getElementById("restore"); if(b)b.onclick=doBackup; if(r)r.onclick=doRestore;
  }
  function find(who,id){return state.habits[who].find(function(x){return x.id===id;});}
  function moveMeal(who,day,id,dir){
    var arr=mealsFor(who,day), i=-1;
    arr.forEach(function(x,k){ if(x.id===id) i=k; });
    if(i<0) return;
    var j=dir==="up"?i-1:i+1;
    if(j<0||j>=arr.length) return;
    var t=arr[i]; arr[i]=arr[j]; arr[j]=t;
    arr.forEach(function(m,k){ var srt=k+1; if(state.meals[m.id]&&(state.meals[m.id].sort||0)!==srt){ state.meals[m.id].sort=srt; enqueue({k:"mealSort",id:m.id,sort:srt}); } });
    saveCache(); render();
  }

  function doBackup(){var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="habits-backup.json";document.body.appendChild(a);a.click();a.remove();toast("Backup downloaded");}
  function doRestore(){var inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";inp.onchange=function(){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);if(!d.habits||!d.logs)throw 0;if(!d.names)d.names={pravin:"Pravin",swetha:"Swetha"};if(!d.notes)d.notes={};if(!d.weights)d.weights={};if(!d.meals)d.meals={};Object.keys(d.logs).forEach(function(k){if(d.logs[k]===true)d.logs[k]="done";});state=d;saveCache();render();toast("Restored");}catch(e){toast("That file isn’t a valid backup");}};rd.readAsText(f);};inp.click();}

  var toastEl=document.getElementById("toast"),tT;
  function toast(m){toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(tT);tT=setTimeout(function(){toastEl.classList.remove("show");},2000);}

  document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){current=t.dataset.who;render();};});
  document.getElementById("prevD").onclick=function(){stepSel(-1);render();if(cloud)pull();};
  document.getElementById("nextD").onclick=function(){stepSel(1);render();if(cloud)pull();};
  document.getElementById("datePick").onchange=function(e){var v=e.target.value;if(!v)return;var p=v.split("-");setSelFromDate(new Date(+p[0],+p[1]-1,+p[2]));render();if(cloud)pull();};

  render(); // show cached data instantly
  (function(){
    var sb=document.getElementById("syncbar");
    if(sb) sb.onclick=function(){ if(cloud){ toast("Retrying sync…"); flush(); pull(); } else { location.reload(); } };
    updateSyncBar();
    var lb=document.getElementById("lightbox"), lbImg=document.getElementById("lightboxImg");
    if(lb&&lbImg){
      app.addEventListener("click",function(e){ var t=e.target; if(t&&t.tagName==="IMG"&&t.dataset&&t.dataset.full){ lbImg.src=t.dataset.full; lb.hidden=false; } });
      lb.addEventListener("click",function(){ lb.hidden=true; lbImg.src=""; });
    }
  })();
  (function(){
    var b=document.getElementById("build");
    b.innerHTML='<span class="chip" role="button" tabindex="0">↻ Build 77 · report-photo-fix</span>';
    function force(){
      toast("Updating to latest…");
      var steps=Promise.resolve();
      if(window.caches) steps=steps.then(function(){return caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));});});
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations) steps=steps.then(function(){return navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));});});
      steps.then(function(){ setTimeout(function(){ location.reload(); },400); });
    }
    var chip=b.querySelector(".chip");
    chip.addEventListener("click",force);
    chip.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); force(); } });
  })();

  var decided=false;
  function decide(){
    if(decided) return; decided=true;
    document.getElementById("modeLine").textContent = cloud ? "Synced to your shared database." : (localReason + " · your data is safe on synced devices.");
    document.querySelector(".foot").style.display = cloud ? "none" : "";
    if(cloud){
      setStatus("wait","Connecting…"); pull();
      try{ supa.channel("habits-sync")
        .on("postgres_changes",{event:"*",schema:"public",table:"logs"},pull)
        .on("postgres_changes",{event:"*",schema:"public",table:"habits"},pull)
        .on("postgres_changes",{event:"*",schema:"public",table:"people"},pull)
        .subscribe(); }catch(e){}
      window.addEventListener("online",function(){setStatus("wait","Back online…");flush();pull();});
      window.addEventListener("offline",function(){setStatus("wait","Offline — will sync");});
      document.addEventListener("visibilitychange",function(){if(!document.hidden)pull();});
    } else {
      setStatus("local", localReason);
    }
    updateSyncBar();
  }
  function startCloud(){
    try{ supa=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY); cloud=true; }
    catch(e){ cloud=false; localReason="Local only · sync error"; }
    decide();
  }
  function failLib(){ if(decided) return; cloud=false; localReason="Local only · sync engine didn’t load (check supabase.min.js is deployed)"; decide(); }
  if(!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY){
    cloud=false; localReason="Local only · no keys in file"; decide();
  } else {
    var tries=0;
    (function waitLib(){
      if(decided) return;
      if(window.supabase){ startCloud(); return; }
      if(++tries>15){   // ~3s — the self-hosted library should be ready well before this
        // last resort: public CDN (only helps if this network allows it)
        var fb=document.createElement("script");
        fb.src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js";
        fb.onload=function(){ window.supabase?startCloud():failLib(); };
        fb.onerror=failLib;
        document.head.appendChild(fb);
        setTimeout(function(){ if(!decided){ window.supabase?startCloud():failLib(); } },4000);
        return;
      }
      setTimeout(waitLib,200);
    })();
  }

  if("serviceWorker" in navigator){
    var hadController=!!navigator.serviceWorker.controller, swRefreshing=false;
    navigator.serviceWorker.addEventListener("controllerchange",function(){
      if(swRefreshing) return;
      if(!hadController) return;               // first install on a fresh visit — no reload needed
      swRefreshing=true; location.reload();    // a new version took over — swap in seamlessly
    });
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("./sw.js").then(function(reg){
        function check(){ try{ reg.update(); }catch(e){} }
        check();                                                   // on load
        setInterval(check, 15*60*1000);                            // every 15 min while open
        document.addEventListener("visibilitychange",function(){ if(!document.hidden) check(); }); // when refocused
        window.addEventListener("pageshow", check);                // when PWA/tab is resumed from background
        window.addEventListener("focus", check);
        window.addEventListener("online", check);                  // when back online
      }).catch(function(){});
    });
    setTimeout(refreshPushState, 500);
  }
  var deferred=null, installBtn=document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;installBtn.classList.add("show");});
  installBtn.onclick=function(){if(!deferred)return;deferred.prompt();deferred.userChoice.then(function(){deferred=null;installBtn.classList.remove("show");});};
  window.addEventListener("appinstalled",function(){installBtn.classList.remove("show");});
})();
</script>
</body>
</html>
